name: daily snapshot

# One snapshot a day. GitHub delays and drops `schedule` on quiet repositories,
# so there are four ticks and the first one that fires does the work: the rest
# see today's file and stop.

on:
  schedule:
    - cron: '23 13,16,19,22 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: once a day
        id: gate
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] && [ -f "data/$(date -u +%F).jsonl" ]; then
            echo "today's snapshot is already in"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        if: steps.gate.outputs.skip != 'true'
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
        if: steps.gate.outputs.skip != 'true'
      - run: node snapshot.mjs
        if: steps.gate.outputs.skip != 'true'
        env:
          VELQUE_RPC: ${{ secrets.VELQUE_RPC }}
      - name: commit
        if: steps.gate.outputs.skip != 'true'
        run: |
          git config user.name "Velque"
          git config user.email "180978138+usevelque@users.noreply.github.com"
          git add data LATEST.md
          git diff --cached --quiet && exit 0
          git commit -m "snapshot $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
